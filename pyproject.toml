[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rankseg-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for RankSEG: performance (Dice/IoU) and runtime on pre-computed probability masks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "RankSEG Benchmark Contributors" }]
dependencies = [
    "rankseg",
    "torch>=2.0",
    "numpy>=1.24",
    "datasets>=2.18",
    "huggingface_hub>=0.23",
    "tqdm>=4.65",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
rankseg-bench = "rankseg_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rankseg_benchmark*"]

[tool.ruff]
line-length = 120
